name: KI-Scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # alle 15 Minuten (GitHub startet manchmal etwas später)
  workflow_dispatch:                # Knopf "Run workflow" zum Testen

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: Scannen und Artikel schreiben
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ vars.MODEL || 'claude-haiku-5-5' }}
          MAX_NEW: ${{ vars.MAX_NEW || '4' }}
        run: python scanner/scan.py
      - name: Neue Daten veröffentlichen
        run: |
          git config user.name "state-of-the-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
